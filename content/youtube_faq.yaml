- id: why-youtube
  q: Why should a business build a YouTube presence?
  a: "People use YouTube to learn how things work and which products to trust, and a useful video keeps being found through search and recommendations long after it's published. A channel also gives you a library you own: the same videos work on your website, in ads, in sales emails and on social media."
- id: never-published
  q: We've never published on YouTube. Where do we start?
  a: "With the YouTube Launch package. We define who the channel is for and what it will be known for, design recurring formats, plan the first videos and produce them. You don't need an existing audience: The Simple Proof started at zero views."
- id: underperforming
  q: Our channel exists, but it's inconsistent or underperforming. Can you help?
  a: "Yes. We start by looking at what you've published: positioning, titles and thumbnails, consistency and where viewers drop off. Then Recurring YouTube Production keeps new videos coming, with each batch informed by how the last one performed."
- id: involvement
  q: How involved do we need to be?
  a: "A kickoff conversation, access to your product and materials, and one person who approves the plan, the scripts and each video before it goes live. We handle the rest: research, writing, production, packaging and, if you like, publishing."
- id: on-camera
  q: Can you make videos without the owner appearing on camera?
  a: "Yes. Options include narration over animation, product-focused visuals, a member of your team, or a clearly disclosed digital presenter. We'll recommend what fits your brand."
- id: formats
  q: Can you develop recurring video formats?
  a: "Yes. Formats are the backbone of a channel: a series structure, look and opening that viewers recognize, so each new video builds on the last one."
- id: longform-shorts
  q: Do you produce long-form videos and Shorts?
  a: "Both. Long-form builds trust and watch time; Shorts reach new people. We often cut Shorts from long-form videos, so one production feeds both."
- id: process
  q: What does the production process involve?
  a: "A discovery call, a written proposal, a channel plan and scripts for your approval, production, review rounds, then delivery or publishing. Recurring work repeats the cycle each month."
- id: packages
  q: What packages are available?
  a: "YouTube Launch for new or reset channels, Recurring YouTube Production for steady output, and custom partnerships that add ads, explainers, series or digital talent. Each one is quoted after a discovery call."
- id: guarantees
  q: Will our channel grow?
  a: "We can't promise views, subscribers or sales. Production quality, consistent publishing, audience research and learning from performance all help a channel grow, but none of them guarantee it. What we do promise is the work we agree on, delivered on schedule and to the standard you approved."
