# Services, packages, process, portfolio, originals and founders.
# Shared by several pages so every fact lives in one place.

status_labels:
  published: Published
  pilot: Pilot episodes produced
  in-production: In production
  in-development: In development

kind_labels:
  founder: Founder portfolio
  original: ILVERA original
  concept: Concept work
  client: Client work

# Legend shown on the Work page.
classes:
  - {key: published, label: Published work, desc: Completed and publicly released.}
  - {key: founder, label: Founder portfolio, desc: "Independent projects owned by an ILVERA founder. Not ILVERA properties, and not client projects."}
  - {key: original, label: ILVERA originals, desc: Media and entertainment that ILVERA owns and develops.}
  - {key: concept, label: Concept work, desc: "Speculative pieces made to show an idea. Never presented as commissioned, always labeled."}
  - {key: development, label: In development, desc: Upcoming or unfinished productions.}

service_groups:
  - need: Grow on YouTube
    services: [youtube-production]
  - need: Sell a product
    services: [product-advertisements, brand-commercials]
  - need: Explain something
    services: [educational-content]
  - need: Tell a story
    services: [branded-entertainment, microdramas, digital-talent]

services:
  youtube-production:
    name: YouTube channel production
    short: "A channel people recognize, not a pile of videos: positioning, formats, scripts, production, packaging and a publishing rhythm."
    long: "We turn your products, expertise and brand into a YouTube channel. It starts with who the channel is for and what it promises. Then come recurring formats, scripts, production, titles and thumbnails, and a schedule you can keep."
    includes: [Channel positioning, Content concepts and formats, Scripts, Animation and editing, "Titles, thumbnails and packaging", Long-form videos and Shorts, A publishing schedule, Improvements based on your channel's numbers]
    fit: "Businesses with no channel yet, or a channel that posts without a plan."
    page: /services/youtube-production/
    proof: {label: "See The Simple Proof case study", path: /work/the-simple-proof/}
  product-advertisements:
    name: Product advertisements
    short: "Ads that show what your product does and why it's worth buying, made for the feeds your customers scroll."
    long: "Product demonstrations, vertical ads for Reels, TikTok and Shorts, product storytelling and campaign assets, delivered in every size each platform needs."
    includes: [Product demonstrations, Vertical ads in 9:16, Product storytelling, Campaign cutdowns and variations]
    fit: "Product brands launching something new, or running ads that need fresh creative."
  brand-commercials:
    name: Cinematic brand commercials
    short: "Visually ambitious films that carry your brand's identity, values and products."
    long: "A commercial built around one strong idea, with deliberate creative direction and a cinematic look and sound, then cut down for every channel you use."
    includes: [Creative concept and direction, A hero film, Cutdowns for social and web]
    fit: "Brands that want to be remembered, not just seen."
  branded-entertainment:
    name: Branded entertainment series
    short: "Episodes people watch because they enjoy them, with your brand woven in naturally."
    long: "A series developed around your business, product or world: recurring hosts or characters, a format that can run for many episodes, and a message that lives inside the story instead of interrupting it."
    includes: [Series concept and format, Episode scripts, A pilot and ongoing episodes]
    fit: "Brands that want an audience that comes back."
  educational-content:
    name: Educational and explainer videos
    short: "Complex products, services and ideas, made clear and worth watching."
    long: "Animated explainers, product walkthroughs, visual demonstrations and stories built around a single idea. Education is where our work started: it's the core of The Simple Proof, Lights On! and Sienna's chess lessons."
    includes: [Animated explainers, Product walkthroughs, Visual demonstrations, Accuracy checks against your own materials]
    fit: "Companies whose product takes too long to explain in words."
    proof: {label: "See the explainer work", path: /work/the-simple-proof/}
  digital-talent:
    name: Digital talent
    short: "Original on-screen characters, from presenters to recurring personalities."
    long: "We design and produce characters who can host your videos, appear across a campaign or anchor a series. You get a consistent face on camera without casting, scheduling or putting yourself on screen. Every digital character is fictional and clearly disclosed as AI-generated. We never present one as a real customer, employee or endorser."
    includes: [Character look and design, Voice and personality, Production of hosted content]
    fit: "Brands that want a recognizable presenter, and founders who'd rather stay off camera."
    proof: {label: "Meet Sienna Torneu", path: /originals/#sienna-torneu}
  microdramas:
    name: Microdramas for businesses
    short: "Short, serialized vertical stories with recurring characters and a reason to watch the next episode."
    long: "Microdramas are short episodes made for phones, each ending on a hook. For a business, that means attention earned episode after episode, with characters, settings and storylines shaped around your brand or campaign. It's one of our formats, not our only one."
    includes: [Series concept and characters, Episode scripts, Vertical production, A release plan]
    fit: "Brands that want their story told in episodes."
    proof: {label: "See our own microdramas in development", path: /originals/}

packages:
  - id: launch
    name: YouTube Launch
    for: "For businesses starting a channel, or resetting one that never found its footing."
    includes: [Brand and audience consultation, Channel positioning, Recurring video formats, An initial content plan, "A set number of finished videos, agreed before we start", "Titles, thumbnails and packaging"]
  - id: recurring
    name: Recurring YouTube Production
    for: "For businesses that need steady publishing without an in-house production team."
    includes: [Recurring long-form videos, Shorts adapted from them, Script development, Editing and animation, Packaging for every upload, "Recommendations based on how your videos perform"]
  - id: commercial
    name: Commercial Production
    for: "For product launches, campaigns and brand moments."
    includes: [Product advertisements, Cinematic brand commercials, Campaign assets and cutdowns, Explainer videos]
  - id: partnership
    name: Custom Production Partnership
    for: "For larger or multi-format work."
    includes: [Branded entertainment series, Microdramas, Digital talent, Several formats on one plan]
pricing_note: "Pricing depends on how many videos you need, how long they are and the production style, so every package is quoted after a discovery call."

process:
  - {name: Discovery call, text: "We learn what you sell, who you sell to and what you want video to do. You leave with an honest recommendation."}
  - {name: Proposal, text: "Scope, deliverables, schedule and price, agreed in writing before anything starts."}
  - {name: Pre-production, text: "Strategy, scripts, the look and, where needed, presenters or characters. You approve before we produce."}
  - {name: Production, text: "Animation, editing, sound, captions and packaging."}
  - {name: Review, text: "You review each cut. Revision rounds are set out in the proposal."}
  - {name: Delivery, text: "Final files for every platform, or publishing on your channel. Recurring work starts its next cycle with what the numbers taught us."}

