originals:
  - id: sienna-torneu
    title: Sienna Torneu
    format: Educational chess channel · Digital presenter
    status: in-production
    logline: "Chess lessons for players rated about 400 to 1500, with a host who has her own look and a dry sense of humor."
    body: "Every game is animated move by move on a board, and every line is checked with a chess engine. The first lesson, Paul Morphy's 1858 Opera House Game, is finished, and the channel is getting ready to launch."
    note: Sienna is a fictional, AI-generated presenter.
    image: still-sienna-portrait
    image_alt: "Portrait of Sienna Torneu, ILVERA's AI-generated chess presenter."
    image2: still-sienna-board
    image2_alt: "A frame from Sienna's first lesson: the board from Paul Morphy's Opera House Game."
  - id: will-vegas-hire-her
    title: Will Vegas Hire Her?
    format: Vertical microdrama
    status: in-development
    logline: "Ava just landed in Las Vegas with one goal: get hired. Jackie knows everybody, and she still doesn't have the job either."
    body: "Fast, funny and closer to the real Vegas than you'd think. The season is being written now, with scenes already in production."
    note: "All characters and venues are fictional. The characters are AI-generated."
    image: still-wvhh-jackie
    image_alt: "Jackie on a sofa, talking on speakerphone."
    image2: still-wvhh-phone
    image2_alt: "A hand holding a phone in a softly lit bedroom, from the opening scene."
    vertical: true
  - id: he-chose-this
    title: He Chose This
    format: Microdrama
    status: in-development
    logline: "Julius was designed to love the woman who bought him. Then he starts to wonder whether any of it was his choice."
    body: "A dark satire about artificial intelligence, devotion, ownership and identity, and the line between programmed behavior and real emotion. The first episodes are being written."
    note: A fictional story. Julius is a fictional character.

founders:
  - id: evan
    name: Evan Surratt
    role: Co-founder and Executive Producer
    short: "Evan brings two decades in hospitality and entertainment across LA and Las Vegas. He's been on camera too, in a national McDonald's commercial."
    bio: "Evan brings two decades of experience in hospitality and entertainment across LA and Las Vegas, and an instinct for what feels real on screen. He's been in front of the camera too, in a national McDonald's commercial. He works on story and entertainment development and leads story development on Will Vegas Hire Her?"
    focus: [Story and entertainment development, Industry relationships, LA and Las Vegas industry insight, On-camera experience]
  - id: justin
    name: Justin Whitmore
    role: Co-founder and Creative Director
    short: "Justin leads creative direction and production, builds the studio's production pipeline and handles new business."
    bio: "Justin leads creative direction, production and the studio's production pipeline, and he is the person you'll talk to about a project. He built and runs The Simple Proof, an educational math and physics channel, and an animated learning series for young children. He has a degree in physics, has held management roles in sales, customer service and sports trading, and works in English and French."
    focus: [Creative direction, Production pipeline, Content and digital media, Business development]
